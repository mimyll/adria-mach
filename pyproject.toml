[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-adria-mach"
version = "0.14.1"
description = "Unofficial Adria MACH custom integration for Home Assistant"
requires-python = ">=3.14"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["pytest-homeassistant==2026.11.0", "ruff==0.14.5"]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
norecursedirs = ["ha"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
